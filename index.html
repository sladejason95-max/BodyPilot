<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1017" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BodyPilot" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="BodyPilot" />
    <meta name="description" content="BodyPilot is a premium AI fitness planner for macros, training splits, readiness, and daily execution." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <title>BodyPilot</title>
    <style>
      :root {
        color-scheme: dark;
        --boot-bg: #0b1017;
        --boot-panel: #121a24;
        --boot-border: rgba(255, 255, 255, 0.12);
        --boot-text: #e2e8f0;
        --boot-subtle: #94a3b8;
        --boot-track: rgba(255, 255, 255, 0.12);
        --boot-fill: #f8fafc;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: var(--boot-bg);
        color: var(--boot-text);
        font-family: "Sora", "Avenir Next", "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      #root {
        min-height: 100vh;
      }

      #boot-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--boot-bg);
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      body[data-app-ready="true"] #boot-shell {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-card {
        width: min(360px, calc(100vw - 48px));
        border-radius: 14px;
        border: 1px solid var(--boot-border);
        background: var(--boot-panel);
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
        padding: 20px;
        text-align: center;
        backdrop-filter: blur(18px);
      }

      .boot-logo {
        display: grid;
        place-items: center;
        height: 76px;
        width: 76px;
        margin: 0 auto;
        border-radius: 24px;
        box-shadow: 0 18px 32px rgba(15, 23, 42, 0.18);
      }

      .boot-logo img {
        display: block;
        height: 76px;
        width: 76px;
        border-radius: 24px;
      }

      .boot-title {
        margin: 18px 0 0;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0;
        color: var(--boot-text);
      }

      .boot-copy {
        margin: 8px 0 0;
        font-size: 14px;
        line-height: 1.5;
        color: var(--boot-subtle);
      }

      .boot-bar {
        height: 4px;
        border-radius: 999px;
        background: var(--boot-track);
        overflow: hidden;
        margin-top: 24px;
      }

      .boot-bar > span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: var(--boot-fill);
        animation: boot-load 1.2s ease-in-out infinite;
        transform-origin: left center;
      }

      @keyframes boot-load {
        0% {
          transform: translateX(-100%) scaleX(0.45);
        }
        55% {
          transform: translateX(20%) scaleX(0.7);
        }
        100% {
          transform: translateX(120%) scaleX(0.45);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-bar > span {
          animation: none;
          transform: none;
          width: 72%;
        }
      }
    </style>
  </head>
  <body data-app-ready="false">
    <div id="boot-shell" aria-hidden="true">
      <div class="boot-card">
        <div class="boot-logo">
          <img src="/app-icon.svg" alt="" />
        </div>
        <h1 class="boot-title">Loading BodyPilot</h1>
        <p class="boot-copy">Opening your workspace.</p>
        <div class="boot-bar"><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
